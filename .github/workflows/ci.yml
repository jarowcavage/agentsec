name: Workbench CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
          node --check agentsec/static/app.js
          python -m pip check
      - name: Unit, API, MCP, and approval tests
        run: python -m pytest -q -m 'not browser and not live' --ignore=tests/test_evaluation.py
      - name: Security and evaluation fixtures
        run: python scripts/evaluate.py --output "$RUNNER_TEMP/agentsec-evaluation.json"
      - name: Desktop and mobile browser tests
        env:
          AGENTSEC_BROWSER: "1"
        run: |
          python -m playwright install --with-deps chromium
          python -m pytest -q -m browser

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Compose and start the container
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.example up -d --build --wait --wait-timeout 60
      - name: Verify health, sample, and persistence
        run: |
          python scripts/container_smoke.py --save "$RUNNER_TEMP/agentsec-scan-id"
          docker compose --env-file .env.example restart
          docker compose --env-file .env.example up -d --wait --wait-timeout 60
          python scripts/container_smoke.py --verify "$RUNNER_TEMP/agentsec-scan-id"
      - name: Stop containers
        if: always()
        run: docker compose --env-file .env.example down --volumes
