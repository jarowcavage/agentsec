services:
  workbench:
    build: .
    init: true
    environment:
      AGENTSEC_GITHUB_REPOSITORY: ${AGENTSEC_GITHUB_REPOSITORY:-}
      AGENTSEC_GITHUB_TOKEN: ${AGENTSEC_GITHUB_TOKEN:-}
      AGENTSEC_APPROVER_PASSWORD: ${AGENTSEC_APPROVER_PASSWORD:-}
      AGENTSEC_DEMO: ${AGENTSEC_DEMO:-0}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
    ports:
      - "127.0.0.1:${AGENTSEC_PORT:-8000}:8000"
    volumes:
      - workbench-data:/var/lib/agentsec
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).close()"]
      interval: 5s
      timeout: 4s
      retries: 6
      start_period: 10s

volumes:
  workbench-data:
